name: Monthly Model Retrain

# Runs on the 1st of every month to refresh historical data, retrain all
# models (Football H2H, Football Totals, Tennis ATP), and commit updated weights.

on:
  schedule:
    - cron: "0 2 1 * *" # 02:00 UTC on the 1st of every month
  workflow_dispatch: # manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        working-directory: model
        run: pip install -r requirements.txt

      - name: Fetch latest historical match data
        working-directory: model
        run: |
          python3 scripts/fetch_historical.py
          python3 scripts/tennis_fetch.py

      - name: Retrain football models (H2H + Totals)
        working-directory: model
        run: |
          python3 scripts/train.py --market h2h
          python3 scripts/train.py --market ou

      - name: Retrain tennis model
        working-directory: model
        run: python3 scripts/train_tennis.py

      - name: Commit and push updated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model/models/ model/data/historical.json model/output/
          if git diff --staged --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "chore(model): automated monthly retrain [skip ci]"
            git push
          fi
