name = "oddket-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# --- D1 ---
# Before first deploy:  wrangler d1 create oddket
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "oddket"
database_id = "ae42dd06-2251-41ce-86dc-461c01ea189f"
migrations_dir = "migrations"

# --- Cron ---
# NOTE: cron triggers are DISABLED because this Cloudflare account is at the
# free-tier limit of 5 cron triggers per account (error 10072 on deploy).
# Scheduling runs through GitHub Actions instead (.github/workflows/cron.yml)
# which POSTs to /api/ingest (09:00 & 18:00 UTC) and /api/closing (18:30 UTC)
# — the exact same code paths as these crons would fire. Re-enable here if
# you upgrade to Workers Paid or free up cron slots.
#
# Budget math (free tier ~500 req/mo on The Odds API):
#   2 pulls/day x (1 sports request + N leagues) + 1 closing-odds pull/day
#   ≈ 4-6 requests/day ≈ 150-180/mo. Safe headroom.
# [triggers]
# crons = [
#   "0 9,18 * * *",   # 09:00 & 18:00 UTC — odds ingestion
#   "30 18 * * *"     # 18:30 UTC — closing-odds pull for logged bets (CLV)
# ]

# --- Vars (safe, non-secret). API key goes in .dev.vars / secret ---
[vars]
ODDS_SPORT = "soccer_epl"
ODDS_REGIONS = "eu"
ODDS_MARKETS = "h2h,totals"
# Client-side slice per sport key (the API charges per REQUEST, not per event),
# so raising this is free — it just stores more fixtures per pull. 200 covers
# a full US Open main draw (~128) comfortably.
ODDS_FETCH_LIMIT = "200"
# Tennis tournament keys to pull. IMPORTANT: each key costs 1 API credit per
# cron run even when it returns empty (out of season), so ONLY list in-season
# tournaments here. The default (unset) tries ALL of TENNIS_SPORTS — ~21 keys
# × 3 runs/day ≈ 63 credits/day, which blows the ~500/month free tier in ~8
# days. Keep this list to what's actually on the calendar:
#   Cincinnati (now) + US Open (Aug 24–Sep 13) + Shanghai (Oct 7–18)
#   → add/remove keys as tournaments come and go.
TENNIS_SPORTS = "tennis_atp_cincinnati_open,tennis_atp_us_open"
