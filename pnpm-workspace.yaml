packages:
  - "apps/*"
  - "packages/*"
  - "worker"

# pnpm 10+ blocks dependency build scripts by default. These three need their
# postinstall to run (esbuild + workerd ship platform binaries; sharp is used
# by Next for image optimization). pnpm 11 uses the allowBuilds map (boolean
# values: true = allowed to run build scripts).
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
