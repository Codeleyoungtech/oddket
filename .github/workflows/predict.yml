name: Predict (cloud model run)

# Runs the Python model in the cloud so the deployed worker always has fresh
# predictions for upcoming fixtures — no laptop required.
#
# Flow:
#   1. Check out the repo (trained models + historical data are committed)
#   2. Fetch upcoming fixtures + current best odds from the deployed worker
#   3. Run predict.py for h2h and totals markets
#   4. POST predictions back to the worker's ingest endpoint
#
# Required repo secrets:
#   ODDKET_WORKER_URL — e.g. https://oddket-worker.<subdomain>.workers.dev
#   PREDICT_SECRET    — must match the worker's PREDICT_SECRET secret

on:
  schedule:
    # Twice daily — before each odds pull (09:00/18:00) so the slips always
    # have fresh predictions. Bookmakers release fixtures gradually, so the
    # afternoon run catches fixtures that appeared after the morning run.
    - cron: "5 8 * * *"
    - cron: "5 16 * * *"
  workflow_dispatch: # manual "Run workflow" button for testing

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (models + data are committed)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install model dependencies
        working-directory: model
        run: pip install -r requirements.txt

      - name: Fetch fixtures + best odds from the worker
        env:
          WORKER_URL: ${{ secrets.ODDKET_WORKER_URL }}
        run: |
          curl -sS -m 60 "$WORKER_URL/api/fixtures/export" \
            -o model/data/fixtures.json
          python3 -c "import json; d=json.load(open('model/data/fixtures.json')); print(f'fetched {d[\"meta\"][\"n_matches\"]} fixtures')"

      - name: Predict h2h (match result)
        working-directory: model
        run: python3 scripts/predict.py --source fixtures --data data/fixtures.json --market h2h

      - name: Predict totals (over/under 2.5)
        working-directory: model
        run: python3 scripts/predict.py --source fixtures --data data/fixtures.json --market ou

      - name: Push predictions to the worker
        env:
          WORKER_URL: ${{ secrets.ODDKET_WORKER_URL }}
          PREDICT_SECRET: ${{ secrets.PREDICT_SECRET }}
        run: |
          for f in model/output/predictions.json model/output/predictions_ou.json; do
            curl -sS -m 60 -X POST "$WORKER_URL/api/predictions/ingest" \
              -H "Content-Type: application/json" \
              -H "x-predict-key: $PREDICT_SECRET" \
              --data-binary @"$f"
            echo
          done

  predict-tennis:
    runs-on: ubuntu-latest
    # Tennis runs after the football job so a tennis-model failure never
    # blocks the football slips. Skips gracefully when the live feed has no
    # ATP main-tour fixtures (off-season, or TENNIS_SPORTS not configured).
    needs: predict
    steps:
      - name: Check out repo (models + data are committed)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install model dependencies
        working-directory: model
        run: pip install -r requirements.txt

      - name: Fetch tennis fixtures + best odds from the worker
        env:
          WORKER_URL: ${{ secrets.ODDKET_WORKER_URL }}
        run: |
          curl -sS -m 60 "$WORKER_URL/api/tennis/fixtures/export" \
            -o model/data/tennis_fixtures.json || true
          python3 - <<'PY'
          import json, os, sys
          n = 0
          if os.path.exists('model/data/tennis_fixtures.json'):
              try:
                  n = len(json.load(open('model/data/tennis_fixtures.json')).get('matches', []))
              except Exception:
                  n = 0
          print(f'fetched {n} tennis fixtures')
          if n == 0:
              print('no tennis fixtures — skipping predict')
              sys.exit(0)
          PY

      - name: Predict tennis h2h
        # The fetch step above already exits when there are no fixtures, so a
        # failure here is a REAL model error — fail the job rather than
        # silently pushing stale predictions.
        working-directory: model
        run: python3 scripts/predict_tennis.py --data data/tennis_fixtures.json

      - name: Push tennis predictions to the worker
        env:
          WORKER_URL: ${{ secrets.ODDKET_WORKER_URL }}
          PREDICT_SECRET: ${{ secrets.PREDICT_SECRET }}
        run: |
          if [ -f model/output/tennis_predictions.json ]; then
            curl -sS -m 60 -X POST "$WORKER_URL/api/tennis/predictions/ingest" \
              -H "Content-Type: application/json" \
              -H "x-predict-key: $PREDICT_SECRET" \
              --data-binary @model/output/tennis_predictions.json
            echo
          fi
