name: Cron (odds + CLV pulls)

# Replaces Cloudflare cron triggers (the account is at the free-tier limit of
# 5 cron triggers, error 10072). These jobs POST to the worker's manual
# trigger endpoints — the exact same code paths the crons would fire.
#
# Required repo secrets:
#   ODDKET_WORKER_URL — e.g. https://oddket-worker.<subdomain>.workers.dev
#   PREDICT_SECRET    — must match the worker's PREDICT_SECRET secret

on:
  schedule:
    # Odds ingestion — 4x daily (00:00, 06:00, 12:00, 18:00 UTC) for fresher
    # odds + denser spread history. Budget with 5 rotating keys (~2,500
    # credits/mo vs ~1,320 burn at 4x): each run costs ~10 credits
    # (football 4 leagues × 2 markets + tennis 2 tournaments × 1).
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    # Closing-odds pull for CLV — once daily at 18:30 UTC (2:30 PM EDT),
    # shortly before evening kickoffs so the closing line is as close to
    # match start as possible.
    - cron: "30 18 * * *"
  workflow_dispatch: # manual "Run workflow" button for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which trigger to fire
        id: which
        run: |
          case "$(TZ=UTC date +%H:%M)" in
            18:30) echo "endpoint=closing" >> "$GITHUB_OUTPUT" ;;
            *)     echo "endpoint=ingest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Call worker endpoints (football + tennis)
        env:
          WORKER_URL: ${{ secrets.ODDKET_WORKER_URL }}
          PREDICT_SECRET: ${{ secrets.PREDICT_SECRET }}
          ENDPOINT: ${{ steps.which.outputs.endpoint }}
        run: |
          # Fire the same code path the old crons would for BOTH sports.
          # Football (football fixtures + logged-bet CLV) and tennis (ATP
          # main tour — ingest + closing). Tennis is a demo no-op off-season.
          # NB: the empty prefix yields /api/ingest, "tennis/" yields
          # /api/tennis/ingest — keep the trailing slash on the prefix.
          for prefix in "" "tennis/"; do
            echo "firing /api/${prefix}${ENDPOINT}"
            curl -sS -m 120 -X POST "$WORKER_URL/api/${prefix}${ENDPOINT}" \
              -H "x-predict-key: $PREDICT_SECRET"
            echo
          done
