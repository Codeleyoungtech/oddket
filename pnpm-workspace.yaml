packages:
  - "apps/*"
  - "packages/*"
  - "worker"

allowBuilds:
  esbuild: set this to true or false
  sharp: set this to true or false
  workerd: set this to true or false

# pnpm 10+ blocks dependency build scripts by default. These three need their
# postinstall to run (esbuild + workerd ship platform binaries; sharp is used
# by Next for image optimization).
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
